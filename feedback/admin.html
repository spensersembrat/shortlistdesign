<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Feedback vs Scout ranking · internal</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz@9..144&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#F5F1EA; --card:#FBF8F2; --ink:#1B1A18; --muted:#6E6962; --line:#D9D2C5; --rust:#C04A1A; --rust-soft:#F3E2D8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.3 Inter, system-ui, sans-serif; }
  .wrap { max-width:980px; margin:0 auto; padding:32px 24px 64px; }
  .eyebrow { font-size:11px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  h1 { font:400 34px/1.2 Fraunces, Georgia, serif; margin:6px 0 6px; }
  h2 { font:400 22px/1.3 Fraunces, Georgia, serif; margin:32px 0 12px; }
  .sub { color:var(--muted); margin:0; max-width:70ch; }
  .tiles { display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; margin-top:24px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .tile b { display:block; font:400 32px/1 Fraunces, serif; font-variant-numeric:tabular-nums; margin-bottom:6px; }
  .tile span { color:var(--muted); font-size:13px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  th, td { text-align:left; padding:10px 12px; border-top:1px solid var(--line); vertical-align:top; }
  th { border-top:0; font-size:12px; font-weight:500; color:var(--muted); background:var(--bg); }
  td.num { font-variant-numeric:tabular-nums; text-align:right; width:56px; }
  .job b { font-weight:600; }
  .job small { display:block; color:var(--muted); }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:500; white-space:nowrap; }
  .pill.apply { background:var(--rust); color:#fff; }
  .pill.skip { border:1px solid var(--ink); }
  .pill.none { color:var(--muted); border:1px dashed var(--line); }
  .pill.shown { background:var(--ink); color:var(--bg); }
  .miss { background:var(--rust-soft); }
  .why { color:var(--muted); font-size:13px; }
  .bars { display:grid; grid-template-columns:220px 1fr 32px; gap:8px 12px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .bar { height:10px; border-radius:5px; background:var(--ink); }
  .count { font-variant-numeric:tabular-nums; text-align:right; }
  .row { display:flex; justify-content:space-between; align-items:end; gap:16px; flex-wrap:wrap; }
  a, .linkbtn { color:var(--ink); font-weight:500; }
  .linkbtn { font:inherit; background:none; border:0; text-decoration:underline; cursor:pointer; color:var(--muted); }
  .empty { color:var(--muted); background:var(--card); border:1px dashed var(--line); border-radius:12px; padding:16px; }
  @media (max-width:720px) { .tiles { grid-template-columns:1fr 1fr; } .bars { grid-template-columns:1fr 1fr 32px; } }
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const pct = (a, b) => b ? Math.round((a / b) * 100) + '%' : '—';

const API = '/api/feedback?role=a&t=' + encodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
(async () => {
  const resp = await fetch(API);
  if (!resp.ok) { document.getElementById('app').innerHTML = '<h1>Link not found</h1>'; return; }
  const { search: s, answers, candidateToken } = await resp.json();
  const candidateUrl = `${location.origin}/feedback/r/${candidateToken}`;
  const jobs = s.jobs;
  const answered = jobs.filter((j) => answers[j.listingId]);
  const yes = (list) => list.filter((j) => answers[j.listingId]?.decision === 'apply');
  const shown = jobs.filter((j) => j.shownToCandidate);
  const notShown = jobs.filter((j) => !j.shownToCandidate);
  const shownAns = shown.filter((j) => answers[j.listingId]);
  const notShownAns = notShown.filter((j) => answers[j.listingId]);

  const missedTop = shown.filter((j) => answers[j.listingId]?.decision === 'skip');
  const buried = notShown.filter((j) => answers[j.listingId]?.decision === 'apply');

  const tally = {};
  answered.forEach((j) => (answers[j.listingId].reasons || []).forEach((r) => tally[r] = (tally[r] || 0) + 1));
  const reasons = Object.entries(tally).sort((a, b) => b[1] - a[1]);
  const maxR = reasons[0]?.[1] || 1;

  document.getElementById('app').innerHTML = `
    <div class="row">
      <div>
        <div class="eyebrow">Internal · ${esc(s.source.env)} · ${esc(s.source.searchLabel)} · ranked by ${esc(s.source.rankingVersion)}</div>
        <h1>${esc(s.candidate.name)}: would apply vs Scout's ranking</h1>
        <p class="sub">${answered.length} of ${jobs.length} jobs answered. Scout showed her the top ${shown.length}. Rows shaded rust are where Scout and she disagree most: a job Scout showed that she'd pass on, or one Scout held back that she'd apply to.</p>
      </div>
      <div><a href="${candidateUrl}" target="_blank" rel="noopener">Open ${esc(s.candidate.name.split(' ')[0])}'s link</a> · <button class="linkbtn" id="copy">Copy her link</button> · <button class="linkbtn" id="reset">Clear answers</button> · <button class="linkbtn" id="refresh">Refresh</button></div>
    </div>

    <div class="tiles">
      <div class="tile"><b>${yes(answered).length}/${answered.length}</b><span>she'd apply to overall</span></div>
      <div class="tile"><b>${pct(yes(shownAns).length, shownAns.length)}</b><span>apply rate on the ${shown.length} Scout showed</span></div>
      <div class="tile"><b>${pct(yes(notShownAns).length, notShownAns.length)}</b><span>apply rate on the ${notShown.length} Scout held back</span></div>
      <div class="tile"><b>${buried.length}</b><span>held back jobs she'd apply to</span></div>
    </div>

    <h2>Job by job</h2>
    <table>
      <thead><tr><th class="num">Scout #</th><th>Job</th><th>Scout</th><th>Her answer</th><th>Why</th><th class="num">Score</th></tr></thead>
      <tbody>${jobs.map((j) => {
        const a = answers[j.listingId];
        const miss = (j.shownToCandidate && a?.decision === 'skip') || (!j.shownToCandidate && a?.decision === 'apply');
        const why = a ? [...(a.reasons || []), a.note ? `“${a.note}”` : ''].filter(Boolean).join(' · ') : '';
        return `<tr class="${miss ? 'miss' : ''}">
          <td class="num">${j.rank}</td>
          <td class="job"><b>${esc(j.title)}</b><small>${esc(j.company)} · ${esc(j.location)}</small>${j.movedBy.length ? `<small>${esc(j.movedBy.join('; '))}</small>` : ''}</td>
          <td>${j.shownToCandidate ? '<span class="pill shown">Shown</span>' : '<span class="why">Held back</span>'}</td>
          <td>${a ? `<span class="pill ${a.decision}">${a.decision === 'apply' ? "Would apply" : "Wouldn't apply"}</span>` : '<span class="pill none">No answer</span>'}</td>
          <td class="why">${esc(why)}</td>
          <td class="num">${j.finalScore.toFixed(1)}</td>
        </tr>`;
      }).join('')}</tbody>
    </table>

    <h2>Why she'd pass</h2>
    ${reasons.length ? `<div class="bars">${reasons.map(([r, n]) => `<div>${esc(r)}</div><div class="bar" style="width:${(n / maxR) * 100}%"></div><div class="count">${n}</div>`).join('')}</div>` : '<div class="empty">No reasons yet. They appear here when she passes on a job and picks why.</div>'}

    <h2>What this says about the ranking</h2>
    <div class="empty" style="color:var(--ink)">${answered.length === 0 ? 'Waiting for answers.' : [
      missedTop.length ? `Scout showed ${missedTop.length} job${missedTop.length > 1 ? 's' : ''} she wouldn't apply to: ${missedTop.map((j) => `#${j.rank} ${esc(j.title)} (${esc(j.company)})`).join(', ')}.` : `She'd apply to every job Scout showed her that she answered.`,
      buried.length ? `Scout held back ${buried.length} job${buried.length > 1 ? 's' : ''} she'd apply to: ${buried.map((j) => `#${j.rank} ${esc(j.title)} (${esc(j.company)})`).join(', ')}.` : '',
      reasons.length ? `Most common reason to pass: “${esc(reasons[0][0])}” (${reasons[0][1]}).` : '',
    ].filter(Boolean).join('<br><br>')}</div>
  `;
  document.getElementById('reset').onclick = async () => {
    if (!confirm('Clear all of her answers for this search?')) return;
    await fetch(API, { method: 'DELETE' }); location.reload();
  };
  document.getElementById('refresh').onclick = () => location.reload();
  document.getElementById('copy').onclick = async (e) => {
    await navigator.clipboard.writeText(candidateUrl); e.target.textContent = 'Copied';
  };
})();
</script>
</body>
</html>
